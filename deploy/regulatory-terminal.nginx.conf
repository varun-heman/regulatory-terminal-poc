# /etc/nginx/sites-available/terminal
#
# TLS in front, the Node server behind. Run certbot after this is in place:
#   sudo certbot --nginx -d terminal.example.com

server {
    listen 80;
    listen [::]:80;
    server_name terminal.example.com;   # <- your hostname

    # certbot rewrites this block to redirect to 443 and adds the certificate

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The app gzips its own responses; do not re-encode them
        gzip off;

        proxy_read_timeout 60s;
    }

    # This app talks to no third party at runtime
    add_header Referrer-Policy   "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options   "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
